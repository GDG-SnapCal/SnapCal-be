services:

  # ── Spring Boot 앱 ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapcal-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - snapcal-net

  # ── Spring Boot 앱 (Supabase 연결 — 로컬 DB/MinIO 불필요) ───
  app-supabase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapcal-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - snapcal-net
    profiles:
      - supabase

  # ── PostgreSQL (Supabase DB 역할) ────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: snapcal-db
    ports:
      - "5432:5432"              # 로컬 DB 툴(DBeaver 등)로 직접 접근 가능
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql  # 컨테이너 첫 실행 시 자동 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - snapcal-net

  # ── MinIO (로컬 S3 호환 스토리지 — Supabase Storage 대체) ────
  minio:
    image: minio/minio:latest
    container_name: snapcal-minio
    ports:
      - "9000:9000"              # API
      - "9001:9001"              # 웹 콘솔 (브라우저로 확인 가능)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - snapcal-net

  # ── MinIO 버킷 초기화 (한 번만 실행) ─────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: snapcal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/snapcal-photos &&
        mc anonymous set public local/snapcal-photos &&
        echo 'MinIO 버킷 초기화 완료'
      "
    networks:
      - snapcal-net

volumes:
  postgres_data:
  minio_data:

networks:
  snapcal-net:
    driver: bridge
